<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 400" width="1160" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">surgtrack3d pipeline</title>
  <desc id="desc">Rectified stereo video feeds a feature tracker and a stereo depth estimator. The tracker's 2D tracks and the robot's kinematic camera poses go into bundle adjustment, which outputs refined camera poses and a sparse point cloud. These, together with dense depth maps from the depth estimator, are fused volumetrically into a registered mesh.</desc>
  <style>
    .txt   { fill: #1f2328; }
    .muted { fill: #59636e; }
    .wire  { stroke: #59636e; fill: none; stroke-width: 2; }
    .head  { fill: #59636e; }
    .ftr   { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
    .kba   { fill: #fff1e5; stroke: #bc4c00; stroke-width: 2; }
    .ftr-t { fill: #0969da; }
    .kba-t { fill: #bc4c00; }
    @media (prefers-color-scheme: dark) {
      .txt   { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .wire  { stroke: #9198a1; }
      .head  { fill: #9198a1; }
      .ftr   { fill: #0c2d4f; stroke: #4493f8; }
      .kba   { fill: #3d1f05; stroke: #f0883e; }
      .ftr-t { fill: #4493f8; }
      .kba-t { fill: #f0883e; }
    }
    .title { font-size: 17px; font-weight: 600; }
    .sub   { font-size: 13px; }
    .label { font-size: 13px; font-style: italic; }
    .io    { font-size: 15px; font-weight: 600; }
    .legend{ font-size: 13px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
  </defs>

  <!-- Input: rectified stereo video -->
  <text class="io txt" x="20" y="196">Rectified</text>
  <text class="io txt" x="20" y="216">stereo video</text>
  <path class="wire" d="M120,205 H180"/>
  <path class="wire" d="M180,105 V285"/>
  <path class="wire" d="M180,105 H218" marker-end="url(#arrow)"/>
  <path class="wire" d="M180,285 H398" marker-end="url(#arrow)"/>

  <!-- Feature tracker -->
  <rect class="ftr" x="220" y="70" width="190" height="70" rx="10"/>
  <text class="title txt" x="315" y="101" text-anchor="middle">Feature tracker</text>
  <text class="sub muted" x="315" y="122" text-anchor="middle">AKAZE + KLT</text>

  <!-- Tracker -> BA -->
  <path class="wire" d="M410,105 H518" marker-end="url(#arrow)"/>
  <text class="label muted" x="464" y="96" text-anchor="middle">2D tracks</text>

  <!-- Robot kinematics input -->
  <text class="io txt" x="625" y="24" text-anchor="middle">Robot kinematic camera poses</text>
  <path class="wire" d="M625,32 V68" marker-end="url(#arrow)"/>

  <!-- Bundle adjustment -->
  <rect class="kba" x="520" y="70" width="210" height="70" rx="10"/>
  <text class="title txt" x="625" y="101" text-anchor="middle">Bundle adjustment</text>
  <text class="sub muted" x="625" y="122" text-anchor="middle">Ceres, kinematic pose priors</text>

  <!-- BA -> Fusion -->
  <path class="wire" d="M730,105 H895 V163" marker-end="url(#arrow)"/>
  <text class="label muted" x="812" y="80" text-anchor="middle">refined poses +</text>
  <text class="label muted" x="812" y="96" text-anchor="middle">sparse point cloud</text>

  <!-- Stereo depth estimator -->
  <rect class="ftr" x="400" y="250" width="230" height="70" rx="10"/>
  <text class="title txt" x="515" y="281" text-anchor="middle">Stereo depth estimator</text>
  <text class="sub muted" x="515" y="302" text-anchor="middle">FoundationStereo, TensorRT</text>

  <!-- Depth -> Fusion -->
  <path class="wire" d="M630,285 H895 V247" marker-end="url(#arrow)"/>
  <text class="label muted" x="762" y="276" text-anchor="middle">dense depth maps</text>

  <!-- Volumetric fusion -->
  <rect class="ftr" x="800" y="165" width="190" height="80" rx="10"/>
  <text class="title txt" x="895" y="200" text-anchor="middle">Volumetric fusion</text>
  <text class="sub muted" x="895" y="221" text-anchor="middle">GPU TSDF + marching cubes</text>

  <!-- Output -->
  <path class="wire" d="M990,205 H1043" marker-end="url(#arrow)"/>
  <text class="io txt" x="1052" y="196">Registered</text>
  <text class="io txt" x="1052" y="216">mesh</text>

  <!-- Legend -->
  <rect class="ftr" x="330" y="360" width="18" height="18" rx="4"/>
  <text class="legend txt" x="356" y="374"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="ftr-t">fast_tissue_rec</tspan>  (Python + CUDA)</text>
  <rect class="kba" x="620" y="360" width="18" height="18" rx="4"/>
  <text class="legend txt" x="646" y="374"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" class="kba-t">kinematic_ba</tspan>  (C++ + Python bindings)</text>
</svg>
